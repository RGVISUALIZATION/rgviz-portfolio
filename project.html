<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RGVIZ — Project</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0b0a;--text:#ece8e0;--muted:#6a6560;--accent:#c9b99a;--border:rgba(201,185,154,0.13)}
html,body{background:var(--bg);color:var(--text);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;overflow-x:hidden;cursor:none}
#cur{position:fixed;width:7px;height:7px;background:var(--accent);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%)}
#ring{position:fixed;width:36px;height:36px;border:1px solid var(--accent);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .3s,height .3s,opacity .3s;opacity:.45;mix-blend-mode:difference}
#ring.big{width:80px;height:80px;opacity:.9}
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:26px 52px}
.back{font-size:10px;letter-spacing:.25em;color:var(--muted);text-decoration:none;text-transform:uppercase;display:flex;align-items:center;gap:10px;transition:color .3s}
.back:hover{color:var(--accent)}
.back::before{content:'←';font-size:14px}
.proj-title-bar{font-size:10px;letter-spacing:.3em;color:var(--text);text-transform:uppercase}
.proj-nav{display:flex;gap:32px}
.proj-nav a{font-size:10px;letter-spacing:.2em;color:var(--muted);text-decoration:none;text-transform:uppercase;transition:color .3s}
.proj-nav a:hover{color:var(--accent)}
.proj-hero{height:100vh;position:relative;overflow:hidden}
.proj-hero img,.proj-hero video{width:100%;height:100%;object-fit:cover;transform:scale(1.06);transition:transform 1.2s cubic-bezier(.25,.46,.45,.94)}
.proj-hero.loaded img,.proj-hero.loaded video{transform:scale(1)}
.proj-hero-info{position:absolute;bottom:52px;left:52px;z-index:2}
.proj-hero-name{font-size:clamp(48px,8vw,100px);font-weight:300;letter-spacing:-.03em;line-height:.9;color:var(--text)}
.proj-hero-meta{margin-top:18px;display:flex;gap:20px;align-items:center}
.proj-hero-meta span{font-size:10px;letter-spacing:.25em;color:var(--accent);text-transform:uppercase}
.proj-hero-meta::before{content:'';display:block;width:36px;height:1px;background:var(--accent)}
.proj-hero-veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(11,11,10,.75) 0%,rgba(11,11,10,.1) 60%)}
.img-full{width:100%;position:relative;overflow:hidden;cursor:none}
.img-full img,.img-full video{width:100%;display:block;height:90vh;object-fit:cover;transition:transform .8s cubic-bezier(.25,.46,.45,.94)}
.img-full:hover img,.img-full:hover video{transform:scale(1.03)}
.img-duo{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.img-duo-item{position:relative;overflow:hidden;cursor:none}
.img-duo-item img{width:100%;display:block;height:70vh;object-fit:cover;transition:transform .8s cubic-bezier(.25,.46,.45,.94)}
.img-duo-item:hover img{transform:scale(1.04)}
.gap{height:3px}
.gap-lg{height:120px}
.proj-bottom{padding:80px 52px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.proj-bottom-l{font-size:clamp(32px,5vw,56px);font-weight:300;letter-spacing:-.025em;color:var(--muted)}
.proj-bottom-l span{color:var(--accent)}
.next-proj{font-size:10px;letter-spacing:.28em;color:var(--muted);text-decoration:none;text-transform:uppercase;display:flex;align-items:center;gap:12px;transition:color .3s}
.next-proj:hover{color:var(--accent)}
.next-proj::after{content:'→';font-size:16px;transition:transform .3s}
.next-proj:hover::after{transform:translateX(4px)}
.rv{opacity:0;transform:translateY(30px);transition:opacity 1s ease,transform 1s ease}
.rv.on{opacity:1;transform:none}
.loader{display:flex;align-items:center;justify-content:center;height:100vh;font-size:10px;letter-spacing:.4em;color:var(--muted);text-transform:uppercase}
</style>
</head>
<body>
<div id="cur"></div>
<div id="ring"></div>

<div class="topbar">
  <a class="back" href="index.html">All Work</a>
  <span class="proj-title-bar" id="topTitle">—</span>
  <div class="proj-nav">
    <a href="#" id="prevLink">Prev</a>
    <a href="#" id="nextLink">Next</a>
  </div>
</div>

<div id="pageContent"><div class="loader">Loading</div></div>

<script>
const SUPA_URL = 'https://lzmlenyafiklsidpmsrh.supabase.co';
const SUPA_KEY = 'sb_publishable_hwtIKqyklqjfGAs-Nu8FvQ_WZDpLUVh';
const headers = { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` };

const slug = new URLSearchParams(location.search).get('slug') || '';

async function load() {
  const [projRes, allRes] = await Promise.all([
    fetch(`${SUPA_URL}/rest/v1/projects?slug=eq.${slug}&select=*`, { headers }),
    fetch(`${SUPA_URL}/rest/v1/projects?select=slug,name&order=sort_order.asc&published=eq.true`, { headers })
  ]);
  const [proj] = await projRes.json();
  const all = await allRes.json();

  if (!proj) { document.getElementById('pageContent').innerHTML = '<div class="loader">Project not found</div>'; return; }

  const imgRes = await fetch(`${SUPA_URL}/rest/v1/project_images?project_id=eq.${proj.id}&select=*&order=sort_order.asc`, { headers });
  const images = await imgRes.json();

  document.title = `RGVIZ — ${proj.name}`;
  document.getElementById('topTitle').textContent = proj.name;

  const idx = all.findIndex(p => p.slug === slug);
  const prev = all[idx - 1];
  const next = all[idx + 1];
  const prevLink = document.getElementById('prevLink');
  const nextLink = document.getElementById('nextLink');
  if (prev) { prevLink.href = `project.html?slug=${prev.slug}`; }
  else { prevLink.style.opacity = '.3'; prevLink.style.pointerEvents = 'none'; }
  if (next) { nextLink.href = `project.html?slug=${next.slug}`; nextLink.textContent = next.name; }
  else { nextLink.style.opacity = '.3'; nextLink.style.pointerEvents = 'none'; }

  let html = '';

  const heroMedia = proj.cover_type === 'video'
    ? `<video src="${proj.cover_url}" autoplay muted loop playsinline></video>`
    : `<img src="${proj.cover_url}" alt="${proj.name}"/>`;

  html += `
    <div class="proj-hero rv" id="heroEl">
      ${heroMedia}
      <div class="proj-hero-veil"></div>
      <div class="proj-hero-info">
        <div class="proj-hero-name">${proj.name}</div>
        <div class="proj-hero-meta">
          <span>${proj.location || ''}</span>
          ${proj.year ? `<span>${proj.year}</span>` : ''}
          <span>${proj.category || ''}</span>
        </div>
      </div>
    </div>
    <div class="gap-lg"></div>
  `;

  const galleryImgs = images.filter(img => img.url !== proj.cover_url);
  let i = 0;
  while (i < galleryImgs.length) {
    const remaining = galleryImgs.length - i;
    if (remaining === 1 || i % 3 === 0) {
      const img = galleryImgs[i];
      const el = img.type === 'video'
        ? `<video src="${img.url}" muted loop playsinline></video>`
        : `<img src="${img.url}" alt=""/>`;
      html += `<div class="img-full rv">${el}</div><div class="gap"></div>`;
      i += 1;
    } else if (remaining >= 2) {
      const a = galleryImgs[i], b = galleryImgs[i+1];
      const elA = a.type==='video' ? `<video src="${a.url}" muted loop playsinline></video>` : `<img src="${a.url}" alt=""/>`;
      const elB = b.type==='video' ? `<video src="${b.url}" muted loop playsinline></video>` : `<img src="${b.url}" alt=""/>`;
      html += `<div class="img-duo rv"><div class="img-duo-item">${elA}</div><div class="img-duo-item">${elB}</div></div><div class="gap"></div>`;
      i += 2;
    } else {
      const img = galleryImgs[i];
      const el = img.type==='video' ? `<video src="${img.url}" muted loop playsinline></video>` : `<img src="${img.url}" alt=""/>`;
      html += `<div class="img-full rv">${el}</div><div class="gap"></div>`;
      i += 1;
    }
  }

  html += `<div class="gap-lg"></div>`;

  if (next) {
    html += `
      <div class="proj-bottom rv">
        <div class="proj-bottom-l">Next<br/><span>${next.name}</span></div>
        <a class="next-proj" href="project.html?slug=${next.slug}">View Project</a>
      </div>
    `;
  }

  document.getElementById('pageContent').innerHTML = html;

  const heroEl = document.getElementById('heroEl');
  const heroMedia2 = heroEl?.querySelector('img, video');
  if (heroMedia2) {
    const trigger = () => heroEl.classList.add('loaded');
    if (heroMedia2.tagName === 'VIDEO') { heroMedia2.addEventListener('loadeddata', trigger); heroMedia2.load(); }
    else { heroMedia2.complete ? trigger() : heroMedia2.addEventListener('load', trigger); }
  }

  document.querySelectorAll('.img-full video, .img-duo-item video').forEach(v => {
    const parent = v.closest('.img-full, .img-duo-item');
    parent.addEventListener('mouseenter', () => v.play().catch(()=>{}));
    parent.addEventListener('mouseleave', () => v.pause());
  });

  const obs = new IntersectionObserver(entries => {
    entries.forEach((e, idx2) => { if (e.isIntersecting) setTimeout(() => e.target.classList.add('on'), idx2 * 80); });
  }, { threshold: .05 });
  document.querySelectorAll('.rv').forEach(el => obs.observe(el));
}

const cur = document.getElementById('cur');
const ring = document.getElementById('ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; cur.style.left=mx+'px'; cur.style.top=my+'px'; });
(function tr(){ rx+=(mx-rx)*.1; ry+=(my-ry)*.1; ring.style.left=rx+'px'; ring.style.top=ry+'px'; requestAnimationFrame(tr); })();
document.addEventListener('mouseover', e => {
  if (e.target.closest('a,.img-full,.img-duo-item')) ring.classList.add('big');
  else ring.classList.remove('big');
});

load().catch(console.error);
</script>
</body>
</html>
